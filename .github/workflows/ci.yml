name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest (the only dev dependency)
        run: python -m pip install --quiet pytest
      - name: Run the suite
        run: python -m pytest tests/ -q

  zero-dependencies:
    name: zero third-party imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: AST-scan every import in tools/ against the stdlib
        run: |
          # The README claims "pure stdlib, zero dependencies". This job is what
          # makes that a checked fact rather than a promise.
          python - <<'PY'
          import ast, pathlib, sys
          std = sys.stdlib_module_names
          bad = []
          for f in sorted(pathlib.Path("tools").glob("*.py")):
              for n in ast.walk(ast.parse(f.read_text())):
                  mods = []
                  if isinstance(n, ast.Import):
                      mods = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      mods = [n.module.split(".")[0]]
                  for m in mods:
                      # sibling modules in tools/ are fine; anything else must be stdlib
                      if m not in std and not m.startswith("rgm_") and m != "acceptance_contract":
                          bad.append(f"{f}:{n.lineno} -> {m}")
          if bad:
              print("::error::third-party import found:\n" + "\n".join(bad))
              sys.exit(1)
          print("zero third-party imports")
          PY

  cli-smoke:
    name: every tool exposes a working CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: python3 tools/<each>.py --help
        run: |
          # Catches syntax errors, broken argparse wiring and 3.10+-only syntax
          # on the oldest supported interpreter.
          rc=0
          for f in tools/*.py; do
            python "$f" --help >/dev/null || { echo "::error file=$f::--help failed"; rc=1; }
          done
          exit $rc

  dogfood-anticheat:
    name: anti-cheat on our own diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Scan this PR for test-tampering
        run: |
          # This repo holds itself to the rule it sells. A PR that skips a test or
          # deletes an assertion without an inline `rgm-allow: <reason>` fails here.
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          python3 tools/rgm_anticheat.py scan --diff-file /tmp/pr.diff --format sentinel
